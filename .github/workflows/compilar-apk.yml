
name: Compilar LA COOPE APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer LA COOPE V9.3
        run: unzip -o LA_COOPE_V9_3_GitHub_NUEVO.zip

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK Android
        run: gradle --no-daemon assembleDebug

      - name: Generar archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: LA_COOPE_V9_3_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
